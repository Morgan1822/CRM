name: crm_mobile
description: "Production-grade Flutter CRM Companion Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Deep Linking
  go_router: ^14.2.0

  # Supabase (Auth, Postgres, Realtime, Storage)
  supabase_flutter: ^2.5.6

  # Firebase & Push Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

  # Environment & Local Storage
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3

  # UI, Icons & Formatting
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
